# Cloud Run ingress configuration — 2026-11-14.
worker_processes 1;
pid /tmp/nginx-20261114.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  server {
    listen __INGRESS_PORT__;
    root /app/frontend/dist;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    location /api/ {
      proxy_pass http://127.0.0.1:8081;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_read_timeout 90s;
    }
    location = /health { proxy_pass http://127.0.0.1:8081; }
    location = /openapi.json { proxy_pass http://127.0.0.1:8081; }
    location /docs { proxy_pass http://127.0.0.1:8081; }
    location /redoc { proxy_pass http://127.0.0.1:8081; }
    location = / { return 302 /brahmos/index.html$is_args$args; }
    location ^~ /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location ~* \.(js|css|json|wasm|jpg|jpeg|png|webp|glb|svg|woff|woff2)$ { try_files $uri =404; expires 1d; }
    location / { try_files $uri /index.html; add_header Cache-Control no-cache; }
  }
}
