<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#000000">
  <title>BRAHMOS</title>
  <link rel="icon" href="media/brahmos-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="hero.css">
  <link rel="stylesheet" href="orbit.css">
  <link rel="stylesheet" href="about.css">
  <link rel="stylesheet" href="material.css">
  <link rel="stylesheet" href="workspace.css">
  <script src="glyphs.js" defer></script>
  <script src="mission-data.js" defer></script>
  <script src="flight-data.js" defer></script>
  <script src="workspace.js" defer></script>
  <script src="glass.js" defer></script>
  <script src="mission-control.js" defer></script>
</head>
<body class="workspace">
  <header class="workspace-header">
    <a class="workspace-brand" href="index.html?return=1#top" aria-label="BRAHMOS home">
      <img src="media/brahmos-mark.svg" width="27" height="27" alt=""><span>BRAHMOS</span>
    </a>
    <nav class="workspace-nav glass" aria-label="Main navigation" data-lenis-prevent>
      <a href="index.html#about">About</a>
      <a href="workspace.html?view=analyze" data-view-link="analyze">Analyze a site</a>
      <a href="workspace.html?view=trip" data-view-link="trip">Plan a trip</a>
      <a href="workspace.html?view=phases" data-view-link="phases">Flight phases</a>
      <a href="workspace.html?view=missions" data-view-link="missions">Missions</a>
    </nav>
  </header>
  <main class="workspace-main">
    <div class="workspace-visual" aria-hidden="true">
      <div class="orbit__sky"></div>
      <div class="workspace-scene">
        <div class="workspace-orbit workspace-orbit--outer"></div>
        <div class="workspace-orbit workspace-orbit--inner"></div>
      </div>
    </div>
    <div class="workspace-title">
      <h1 id="workspace-title">Analyze a site</h1>
      <p id="workspace-subtitle"></p>
    </div>
    <div class="workspace-deck">
      <section class="workspace-panel glass" aria-labelledby="setup-title">
        <h2 id="setup-title"></h2>
        <form id="workspace-form"></form>
      </section>
      <div class="workspace-view" aria-hidden="true">
        <p class="workspace-scene-label"></p>
      </div>
      <section class="workspace-panel workspace-panel--detail glass" aria-labelledby="detail-title">
        <h2 id="detail-title"></h2>
        <div id="workspace-detail" aria-live="polite"></div>
      </section>
    </div>
    <div class="workspace-readouts">
      <section class="workspace-panel glass" aria-labelledby="readout-title">
        <h2 id="readout-title"></h2><div id="workspace-readout"></div>
      </section>
      <section class="workspace-panel glass" aria-labelledby="link-title">
        <h2 id="link-title"></h2><div id="workspace-link"></div>
      </section>
    </div>
    <noscript><p>Enable JavaScript to use the BRAHMOS mission dashboards.</p></noscript>
  </main>
  <footer class="site-footer glass" data-halo-surface>
    <a href="index.html?return=1#top" class="site-footer__brand" aria-label="BRAHMOS home">
      <img src="media/brahmos-mark.svg" width="37" height="37" alt=""><span>BRAHMOS</span>
    </a>
    <nav aria-label="Footer navigation">
      <a href="index.html#about">About</a>
      <a href="workspace.html?view=analyze" data-view-link="analyze">Analyze a site</a>
      <a href="workspace.html?view=trip" data-view-link="trip">Plan a trip</a>
      <a href="workspace.html?view=phases" data-view-link="phases">Flight phases</a>
      <a href="workspace.html?view=missions" data-view-link="missions">Missions</a>
    </nav>
  </footer>
</body>
</html>
